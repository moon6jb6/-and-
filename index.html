<script>
const DATA = {"k":{"system":"能源经济发展原理与运行机制知识体系","version":"v5","built":"2026-10-31","parts":[{"id":"P1","name":"能源经济的基本事实","sub":"目前是什么状态","accent":"#38bdf8","lead":"先把状态描述清楚。事实部分不做解释，只回答「多少、在哪、怎么变」。描述的价值取决于口径是否锁定——同一指标换一个口径，结论可以完全相反。","modules":[{"id":"K01","title":"能源供给","sub":"资源禀赋如何变成可用能"},{"id":"K02","title":"能源需求","sub":"增长、结构与效率"},{"id":"K03","title":"能源价格","sub":"同样是能源，为什么定价机制完全不同"},{"id":"K04","title":"能源产业与贸易","sub":"能源不只是消耗品，更是一个产业体系"}],"count":4},{"id":"P2","name":"能源经济的运行机制","sub":"为什么这样运行","accent":"#a78bfa","lead":"从状态走向机制。机制必须能回答「通过什么渠道、在多长时间内、以多大规模」起作用，否则只是把相关性换个说法。这一部分是整个体系的理论核心。","modules":[{"id":"K05","title":"能源转换","sub":"热力学如何给效率封顶"},{"id":"K06","title":"能源平衡","sub":"一张表如何锁住所有的账"},{"id":"K07","title":"能源—经济耦合","sub":"能源如何进入经济增长的方程"}],"count":3},{"id":"P3","name":"能源经济的核心问题","sub":"面临什么问题","accent":"#fbbf24","lead":"问题不是「哪里不好」，而是「约束在哪里相互冲突」。每一个核心问题都是一组无法同时满足的约束，因此不存在纯技术解。","modules":[{"id":"K08","title":"碳排放","sub":"从燃料里的碳，到大气里的碳"},{"id":"K09","title":"能源安全","sub":"从进口依存度到系统韧性"},{"id":"K10","title":"能源效率与反弹效应","sub":"为什么省下来的能源又花掉了"},{"id":"K11","title":"转型的分配后果","sub":"代价落在谁身上"}],"count":4},{"id":"P4","name":"能源经济的分析方法","sub":"如何科学地研究","accent":"#22d3ee","lead":"方法回答的不是「怎么算」，而是「凭什么让人相信」。每种方法都有其成立条件，用错方法的后果比算错数字更严重。","modules":[{"id":"K12","title":"分解与归因","sub":"把变化拆成可以负责的部分"},{"id":"K13","title":"成本与技术","sub":"LCOE 解决了什么，又误导了什么"},{"id":"K14","title":"因果识别与情景","sub":"没有反事实，就没有影响"}],"count":3},{"id":"P5","name":"能源经济的政策与未来","sub":"未来如何变化、政策如何调整","accent":"#34d399","lead":"情景不是预测。每个未来判断都由一组假设推出，因此结论的可信度上限等于假设的合理性，报告结论必须同时报告假设。","modules":[{"id":"K15","title":"碳定价","sub":"税、市场与信用，三种工具解决同一个问题"},{"id":"K16","title":"转型路径与政策冲突","sub":"保供、降成本、减排，三者不可同时最优"}],"count":2}],"modules":[{"id":"K01","part":"P1","title":"能源供给","sub":"资源禀赋如何变成可用能","concepts":[{"t":"一次能源 / 二次能源","d":"煤、油、气、水、风、光、核是一次能源；电、热、成品油是二次能源。核算中二者不可相加，因为一次能源在转换中已损失了一部分。"},{"t":"储量 / 可采储量 / 储采比","d":"「储量」是地质概念，「可采储量」才是经济概念。储采比 = 年末可采储量 ÷ 当年产量，回答「按当前速度还能挖几年」。"},{"t":"装机容量 / 发电量 / 有效出力","d":"装机是铭牌功率（kW），发电量是实际产出（kWh），有效出力系数 = 发电量 ÷（装机 × 8760）。三者是递进的约束关系，不是同义词。"}],"first":"供给能力的三个乘数：资源 × 技术可达 × 经济可采。任何一个为零，供给即为零。因此「储量」不等于供给，「可采储量」才是；「装机」不等于供给，「有效出力」才是。这条逻辑解释了为什么一个国家可以资源丰富却能源短缺，也可以装机巨大却仍然缺电。","mechanism":[{"t":"资源→勘探→开采","d":"上游决定供给上限，受地质条件与勘探投入约束，短期不可逆。"},{"t":"开采→加工转换","d":"中游把一次能源变成可用能，效率由热力学第二定律封顶（见 K05）。"},{"t":"转换→输配→终端","d":"下游决定「送得到吗」，受电网/管网容量与调峰能力约束。"},{"t":"新能源的特殊机制","d":"风光不消耗燃料，供给能力由「资源特性（间歇性）+ 系统调节能力」共同决定。这是它与化石能源最根本的区别：装机增长不会自动转化为电量增长。"}],"history":[{"t":"1990s","d":"以煤为主，能源自给率极高，供给问题主要是「产量够不够」。"},{"t":"2000s","d":"石油天然气进口快速上升，供给问题变成「对外依存度」。"},{"t":"2010s","d":"新能源规模化起步，供给问题第一次出现「装机和电量脱节」。"},{"t":"2020s","d":"风光装机首超火电，供给问题转为「系统能否消纳」。"}],"status":[{"name":"发电装机（2025）","val":"38.91 亿kW，同比 +16.1%","src":"A-10","srcTitle":"发电装机容量（合计）","srcUrl":"https://www.nea.gov.cn/20260129/6874f211acd0417eab7ac10c3061a7c2/c.html"},{"name":"风光装机（2025）","val":"6.40 / 12.02 亿kW，合计 18.4 亿kW 首次超过火电 15.39 亿kW","src":"A-11","srcTitle":"风电 / 光伏装机","srcUrl":"https://www.nea.gov.cn/20260129/6874f211acd0417eab7ac10c3061a7c2/c.html"},{"name":"原煤产量（2025）","val":"48.5 亿吨（公报全口径）／48.3 亿吨（规上口径）","src":"A-02","srcTitle":"原煤产量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"原油 / 天然气产量（2025）","val":"21,608.7 万吨 / 2,620.6 亿m³","src":"A-06","srcTitle":"原油产量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"新能源利用率（2025）","val":"风电 94.3%、光伏 94.8%（2024 为 95.9% / 96.8%）","src":"A-16","srcTitle":"新能源利用率（风 / 光）","srcUrl":"https://mwind.in-en.com/html/wind-2465258.shtml"}],"tension":[{"t":"装机 ≠ 供给","d":"2025 年风光装机已超火电，但发电量占比仍远低于装机占比——利用小时差异（风光约 1,200–2,100 h，火电约 4,000 h+）决定了同样的铭牌功率产出不同电量。"},{"t":"有效供给受系统约束","d":"2025 年利用率较 2024 年下降 1.6 / 2.0 个百分点，说明新增装机已快于系统消纳能力的提升速度。"},{"t":"统计口径可切换结论","d":"「48.5 亿 vs 48.3 亿吨」的差不是误差，是全口径与规上口径的差，跨口径比较会得出错误的增速。"}],"methods":[{"t":"有效出力系数","d":"发电量 ÷（装机 × 8760），衡量装机转化为电量的程度。"},{"t":"利用小时数","d":"发电量 ÷ 装机容量，是同一件事的另一种表达，便于跨技术比较。"},{"t":"Shannon 多样性指数","d":"H = −Σ sᵢ ln sᵢ，衡量供给结构的分散程度，是能源安全的输入（见 K09）。"},{"t":"储采比","d":"可采储量 ÷ 年产量，用于判断资源约束的紧迫性。"}],"future":"供给侧的长期趋势是从「资源约束」转向「系统约束」：过去缺的是资源，现在缺的是消纳、调峰、跨区输送与储能。这意味着政策重心也从「多建」转向「用好」——评价指标应从装机容量转向有效出力与系统成本。","domains":[{"no":"01","name":"能源供给","accent":"#fbbf24"}],"questions":[{"id":"01-01","q":"全球及中国能源生产结构发生了怎样的变化？煤炭、石油、天然气、核能、水电、风电、光伏分别处于什么发展阶段？","layer":"L1","status":"可算"},{"id":"01-02","q":"中国能源生产与消费之间是否存在结构性错配？哪些地区是生产地，哪些是消费地？","layer":"L1","status":"部分可算"},{"id":"01-05","q":"新能源装机增长是否真正转化为有效能源供给？弃风、弃光、利用小时数如何变化？","layer":"L2","status":"可算"},{"id":"01-06","q":"电力系统的调峰、储能、备用容量和跨区域输电能力能否支撑新能源持续增长？","layer":"L2","status":"部分可算"}]},{"id":"K02","part":"P1","title":"能源需求","sub":"增长、结构与效率","concepts":[{"t":"终端消费 / 一次能源消费","d":"终端消费指最终用户实际使用的能源；一次能源消费还包含转换损失。二者相差的部分就是转换与输配损失，因此「一次能源消费」总是大于「终端消费」。"},{"t":"能源强度 / 能源生产率","d":"强度 = 能耗 ÷ 产出，是比值的比值，分子分母都可变；生产率是其倒数。强度下降不等于总量下降（见下）。"},{"t":"需求弹性","d":"∂lnE / ∂lnX，X 可为收入、产出、价格。弹性是需求的「形状」，不同产业、不同品种的弹性差异极大，这是结构分析的起点。"}],"first":"需求不是「想要多少」，而是「在给定价格、收入与技术条件下，用多少能源能产出合意的服务」。因此需求分析的真正对象不是能源本身，而是能源提供的服务：照明、动力、热、移动。这解释了为什么同样 GDP 的国家能耗可以差几倍——差在产出结构与服务方式。","mechanism":[{"t":"收入效应","d":"收入增长 → 服务需求增长 → 能源需求增长，但弹性通常小于 1。"},{"t":"价格效应","d":"价格上升 → 替代与节约，短期弹性小、长期弹性大，因为资本存量需要时间调整。"},{"t":"结构效应","d":"产业从重工业转向服务业，单位增加值能耗下降，但总能耗未必下降。"},{"t":"技术效应","d":"单耗下降，但可能被规模扩张抵消（反弹效应，见 K10）。"}],"history":[{"t":"工业化阶段","d":"需求增长主要由重工业投资驱动，能源消费弹性长期大于 1。"},{"t":"城市化阶段","d":"建筑与交通用能上升，居民生活用能占比提高。"},{"t":"服务化阶段","d":"单位 GDP 能耗下降，但用电量仍增长——电气化在替代直接燃料。"},{"t":"数字化阶段","d":"数据中心等新型负荷出现，需求预测的不确定性上升。"}],"status":[{"name":"能源消费总量（2025）","val":"61.7 亿tce，同比 +3.5%；煤炭占比 51.4%（−1.8pp）","src":"B-03","srcTitle":"能源消费总量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"全社会用电量（2025）","val":"103,682 亿kWh，首破 10 万亿，同比 +5.0%","src":"B-06","srcTitle":"全社会用电量","srcUrl":"http://news.cnr.cn/native/gd/20260117/t20260117_527496549.shtml"},{"name":"万元 GDP 能耗（2025）","val":"−5.1%（扣除原料用能和非化石能源消费量后口径）","src":"B-08","srcTitle":"万元 GDP 能耗 / 碳排放降幅","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"非化石能源占比（2024）","val":"19.8%，2020 年为 16.0%","src":"B-09","srcTitle":"非化石能源占一次能源消费比重","srcUrl":"http://www.chinanews.com.cn/cj/2025/11-08/10512162.shtml"}],"tension":[{"t":"强度下降 ≠ 总量下降","d":"2025 年万元 GDP 能耗下降 5.1%，但能源消费总量仍增长 3.5%。原因是 GDP 增速（约 5%）乘以强度降幅，仍大于零。使总量不增的临界条件是：GDP 增速 ≤ 强度降幅。"},{"t":"电气化不等于效率","d":"电气化把分散燃烧换成集中发电，若发电效率与电网损耗不改善，终端效率提升可能被转换损失抵消。"},{"t":"口径变化会改写结论","d":"「扣除原料用能和非化石」是 2021 年后才普遍采用的口径，用它和 2015 年的旧口径数字比，会得到虚高的改善幅度。"}],"methods":[{"t":"Tapio 脱钩弹性","d":"e = (%ΔE)/(%ΔGDP)；e<0 强脱钩，0–0.8 弱脱钩，0.8–1.2 连结，>1.2 负脱钩。"},{"t":"LMDI 分解","d":"把能耗变化拆成规模、结构、强度三项，无残差可完全加和（见 K12）。"},{"t":"需求弹性估计","d":"AIDS、面板协整等，但中国价格长期受管制，估出的是「管制下的表观弹性」。"},{"t":"部门法预测","d":"按部门活动量 × 单位活动能耗逐层累加，是 LEAP 类模型的骨架（见 K14）。"}],"future":"需求的长期形态由三件事决定：人口见顶、城镇化放缓、产业升级。三者都指向「总量增速下台阶 + 结构持续电力化」。因此未来需求管理的重点不再是压总量，而是压峰值——即最大负荷而非年电量。","domains":[{"no":"02","name":"能源需求","accent":"#fb923c"}],"questions":[{"id":"02-01","q":"中国能源消费总量和人均能源消费量如何变化？处于什么国际位次？","layer":"L1","status":"可算"},{"id":"02-04","q":"经济增长与能源消费之间是否已经出现脱钩？脱钩程度如何？","layer":"L2","status":"可算"},{"id":"02-05","q":"城市化、人口变化、产业升级和居民收入增长如何影响能源需求？各自贡献多少？","layer":"L2","status":"部分可算"},{"id":"02-07","q":"电气化率提高是否意味着能源效率提高？是否存在电力消费增长快于终端能效改善的情况？","layer":"L2","status":"可算"}]},{"id":"K03","part":"P1","title":"能源价格","sub":"同样是能源，为什么定价机制完全不同","concepts":[{"t":"政府定价 / 指导价 / 市场价","d":"三种机制并存是中国能源市场的基本事实。居民电价、部分管输费属政府定价；成品油设调价机制属指导价；煤、电（部分）属市场价。"},{"t":"边际成本定价 / 平均成本定价","d":"前者用于可竞争环节，后者用于自然垄断环节（电网、管网）。混用会导致投资信号错误：输配电用边际成本定价会收不回固定投资。"},{"t":"价格传导率","d":"上游成本变化传导到终端价格的比例。传导不完全不是缺陷，而是价格管制与长协合同共同作用的结果。"}],"first":"价格是稀缺性的信号。能源市场的特殊性在于：它同时存在可竞争环节（发电、售电、煤炭）与自然垄断环节（电网、管网），因此**不存在单一的「能源价格」**。讨论能源价格必须先问：哪一个环节的价格、由谁定、传导到谁。","mechanism":[{"t":"煤炭","d":"以市场定价为主，但长协机制覆盖大部分电煤，形成「长协价 + 现货价」双轨。"},{"t":"石油","d":"与国际油价挂钩，十个工作日一调的成品油定价机制，含缓冲区间。"},{"t":"天然气","d":"门站价由省级定价，居民与非居民交叉补贴，LNG 现货市场化程度较高。"},{"t":"电力","d":"「中长期为主 + 现货为辅 + 辅助服务」三层市场；发电侧竞争、输配垄断、销售侧逐步放开。新能源入市后出现价格捕获率下降（见下）。"}],"history":[{"t":"计划定价期","d":"价格长期固定，主要功能是分配而非信号。"},{"t":"双轨制期","d":"计划价与市场价并存，出现套利与寻租空间。"},{"t":"市场化推进期","d":"2015 年新一轮电改，管住中间、放开两头。"},{"t":"现货与新能源入市期","d":"2020s 现货市场铺开，新能源大量入市改变价格形成机制。"}],"status":[{"name":"电力现货正式运行（截至 2026-09-30）","val":"10 省（山西、广东、山东、甘肃、蒙西、湖北、浙江、河北南网、安徽、福建）","src":"D-01","srcTitle":"电力现货市场正式运行省份","srcUrl":"https://www.cpnn.com.cn/news/dfny/202609/t20260922_1916973_wap.html"},{"name":"市场化交易电量（2025）","val":"6.64 万亿kWh，占全社会用电量 64.0%","src":"D-04","srcTitle":"市场化交易电量 / 占比","srcUrl":"https://www.nea.gov.cn/20260130/b5b729cb7ad74723bcd614b663c75da6/c.html"},{"name":"碳市场配额均价（2025）","val":"加权均价 62.36 元/吨，年末收盘 74.63 元/吨","src":"D-06","srcTitle":"全国碳市场配额价格（2025）","srcUrl":"https://www.stcn.com/article/detail/3566947.html"},{"name":"绿证交易（2025）","val":"9.30 亿个，累计 14.83 亿个，下半年均价约 4.14 元/个","src":"D-08","srcTitle":"绿证核发 / 交易","srcUrl":"https://www.nea.gov.cn/20260522/a6cedbcbc2764b80abc85836ee862461/c.html"}],"tension":[{"t":"「均价」有三种算法","d":"成交额÷成交量、日均收盘价均值、年末收盘价。2025 年三者分别约 62.4、约 60、74.63 元/吨，同年差 20%。"},{"t":"新能源入市压低自身价格","d":"风光出力集中时段供给激增，现货价格被压低，导致新能源的「价格捕获率」低于基荷电源，进而影响其投资回报。"},{"t":"价格信号与保供目标冲突","d":"价格上行时抑制需求，但保供要求压低价格；这一冲突在每次能源紧张时都会出现（见 K16）。"}],"methods":[{"t":"价格传导模型","d":"投入产出价格模型 Δp = Δc·(I−A)⁻¹，测算能源涨价对各部门成本的影响。"},{"t":"价格捕获率","d":"新能源加权平均成交价 ÷ 基荷均价，衡量新能源在市场中的相对议价力。"},{"t":"峰谷价差与储能套利","d":"价差 × 循环次数 × 效率 − 运维，判断储能投资是否可行。"},{"t":"跨市场引导关系","d":"Granger 因果或信息流，判断国际价格向国内的传导路径与时滞。"}],"future":"价格改革的长期方向是「管住中间、放开两头」，但难点不在放开，而在**输配电价的核定**：容量电价、辅助服务补偿、现货上限设计共同决定投资信号是否充足。如果只放开电量价格而不解决容量补偿，就会出现「缺电但没人建电厂」的经典困局。","domains":[{"no":"03","name":"能源市场与价格","accent":"#f97316"}],"questions":[{"id":"03-01","q":"煤炭、石油、天然气和电力的价格是如何形成的？各自的市场化程度有多高？","layer":"L1","status":"可算"},{"id":"03-02","q":"国际能源价格波动如何传导至国内能源市场？传导弹性与滞后多久？","layer":"L1","status":"部分可算"},{"id":"03-05","q":"新能源参与电力市场后，是否改变了电力价格形成机制？","layer":"L2","status":"部分可算"},{"id":"03-06","q":"峰谷电价、容量电价、辅助服务补偿能否有效引导储能和灵活性资源投资？","layer":"L2","status":"部分可算"},{"id":"03-07","q":"能源价格改革对企业生产成本、居民生活成本和通货膨胀有什么影响？","layer":"L3","status":"部分可算"}]},{"id":"K04","part":"P1","title":"能源产业与贸易","sub":"能源不只是消耗品，更是一个产业体系","concepts":[{"t":"增加值 / 总产值","d":"总产值含中间投入，增加值不含。比较能源产业的经济贡献必须用增加值，否则会把上游投入重复计算。"},{"t":"产业关联：影响力 / 感应度","d":"影响力系数衡量某产业每增加一单位最终需求对其他产业的拉动；感应度衡量其他产业增长时它的被动扩张程度。能源产业通常两者都高。"},{"t":"显性比较优势 RCA","d":"(本国该产品出口占比) ÷ (世界该产品出口占比)，用于判断新能源制造业的国际竞争力。"}],"first":"把能源当产业看，会得到一个反直觉的结论：能源转型的**经济总量效应**可能远大于其**减排效应**。光伏、风电、电池、电动车构成了一条新的制造业链条，其产值、就业与出口规模已足以影响宏观增长。因此「能源转型=成本」这个直觉是错的，它同时是一次产业重构。","mechanism":[{"t":"上游","d":"资源开采与初加工，资本密集、周期性强，价格由全球供需决定。"},{"t":"中游","d":"转换与加工（发电、炼油、制氢），受价格管制与产能利用率双重约束。"},{"t":"下游","d":"输配与销售，自然垄断属性强，受监管回报率约束。"},{"t":"装备制造","d":"光伏、风电、储能、电池，制造业属性，靠规模效应与学习曲线降本（见 K13）。"}],"history":[{"t":"资源型阶段","d":"产业=开采，增加值集中在资源端，受价格周期支配。"},{"t":"重化工业阶段","d":"电力、炼化成为支柱，产业关联度上升。"},{"t":"装备制造阶段","d":"新能源制造业崛起，出口结构改变。"},{"t":"系统服务阶段","d":"储能、虚拟电厂、综合能源服务成为新增长点。"}],"status":[{"name":"风光装机（2025）","val":"18.4 亿kW，首次超过火电","src":"A-11","srcTitle":"风电 / 光伏装机","srcUrl":"https://www.nea.gov.cn/20260129/6874f211acd0417eab7ac10c3061a7c2/c.html"},{"name":"新型储能（2025）","val":"1.36 亿kW / 3.51 亿kWh，平均时长 2.58 h","src":"E-04","srcTitle":"新型储能累计装机 / 时长","srcUrl":"https://www.nea.gov.cn/20260130/50f657ce87f848e1a9a1861d1fd9aa23/c.html"},{"name":"能源进出口（2025）","val":"原油进口 57,773 万吨、天然气 12,787 万吨、煤及褐煤 49,027 万吨","src":"C-04","srcTitle":"原油 / 天然气 / 煤及褐煤进口量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"}],"tension":[{"t":"产能过剩与低价竞争","d":"制造业环节靠规模降本，但规模扩张快于需求时会引发价格战，进而压缩研发投入——这是「学习曲线」的另一面。"},{"t":"增加值归属错配","d":"资源型地区贡献产量，增加值却可能记在加工或消费地，导致区域财政失衡（见 K11）。"},{"t":"贸易摩擦","d":"新能源产品出口高增长必然触发贸易伙伴的反补贴与本地化要求，CBAM 是其中一种形式（见 K15）。"}],"methods":[{"t":"投入产出分析","d":"影响力/感应度系数、完全消耗系数，量化产业关联。"},{"t":"RCA 与贸易竞争力","d":"比较优势指数，配合出口价格弹性判断竞争力可持续性。"},{"t":"学习曲线","d":"LR = 1 − 2^b，累计产量翻倍时的成本降幅（见 K13）。"},{"t":"就业乘子","d":"直接+间接就业 ÷ 投资额，用于评估转型的就业净效应。"}],"future":"产业政策的着力点正在从「补贴装机」转向「稳定需求 + 技术迭代」。补贴退坡后，决定产业能否持续的是两件事：国内需求的稳定性（避免大起大落）与技术迭代的速度（保持成本领先）。二者都不是靠财政能长期维持的。","domains":[{"no":"04","name":"能源产业","accent":"#fb7185"},{"no":"11","name":"国际能源经济","accent":"#a3e635"}],"questions":[{"id":"04-02","q":"煤炭、电力、石油、天然气、新能源产业之间的产业关联是什么？","layer":"L1","status":"可算"},{"id":"04-03","q":"新能源产业是否形成了新的经济增长点？其真实经济贡献如何测算？","layer":"L1","status":"部分可算"},{"id":"04-04","q":"光伏、风电、储能、动力电池是否存在产能过剩和低价竞争？程度如何？","layer":"L2","status":"部分可算"},{"id":"04-05","q":"能源技术进步如何改变能源生产成本和产业竞争力？","layer":"L2","status":"部分可算"}]},{"id":"K05","part":"P2","title":"能源转换","sub":"热力学如何给效率封顶","concepts":[{"t":"转换效率 η","d":"产出能量 ÷ 投入能量。发电效率 = 发电量 ÷ 燃料热值投入。"},{"t":"发电煤耗 / 供电煤耗","d":"前者按发电量算，后者按上网电量算，差一个厂用电率（5–7 个百分点）。混用会让效率看起来差出好几个百分点。"},{"t":"热电联产分摊","d":"同时产电与产热时，燃料与排放必须在电、热之间分摊。分摊方法（热量法、㶲法、等比分摊）不同，结果差异显著。"}],"first":"热力学第一定律说能量守恒，第二定律说**可用能必然减少**。所以转换环节的损失不是技术不够好，而是物理必然：任何热机效率都受卡诺极限约束。这解释了两件事：为什么能源转换永远有损失，以及为什么「提高效率」有物理天花板——真正的减排空间在**改变转换路径**（如可再生能源发电不经过热机），而不是把热机效率推到 100%。","mechanism":[{"t":"燃料化学能 → 热能","d":"燃烧，效率接近 100%，但产生 CO₂（碳在此刻离开燃料）。"},{"t":"热能 → 机械能","d":"受卡诺效率限制，超超临界机组约 45–48%。"},{"t":"机械能 → 电能","d":"发电机效率很高（>98%），损失主要在前后两端。"},{"t":"输配","d":"线损约 4–6%，随电压等级与输送距离变化。"}],"history":[{"t":"亚临界","d":"效率约 35–38%，中国 2000s 主力机型。"},{"t":"超临界 / 超超临界","d":"效率 40–48%，2010s 大规模替代。"},{"t":"热电联产","d":"综合能效可达 70%+，因为利用了做功后的余热。"},{"t":"非热机路径","d":"水电、风电、光伏不经过热机，效率概念变为「资源→电量」的转换率。"}],"status":[{"name":"全电源利用小时（2025）","val":"3,119 h（2024 为 3,442 h，−312 h）","src":"A-18","srcTitle":"全电源发电设备平均利用小时","srcUrl":"https://www.nea.gov.cn/20260129/6874f211acd0417eab7ac10c3061a7c2/c.html"},{"name":"风光利用小时（2024）","val":"风电 2,127 h、光伏 1,211 h","src":"A-19","srcTitle":"风电 / 光伏利用小时","srcUrl":"https://www.cpnn.com.cn/news/xny/202502/t20250219_1773747.html"},{"name":"发电量（2025）","val":"105,752.5 亿kWh；火电 63,271.5、水电 14,616.7、核电 4,852.3、风电 11,279.2、光伏 11,732.4","src":"A-14","srcTitle":"全口径发电量及分品种","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"}],"tension":[{"t":"总排放与排放强度必须分开算","d":"固定燃料投入时，总排放由含碳量与氧化率锁定、与效率无关；但固定电量需求时，效率越高所需燃料越少、总排放越低。两种情形结论相反，混为一谈会得出「效率与减排无关」的错误结论。"},{"t":"效率提升的 rebound","d":"单位产品能耗下降会降低单位成本，进而扩大产量，总能耗下降幅度小于工程测算（见 K10）。"},{"t":"分摊规则决定归属","d":"热电联产的分摊方法会改变电、热两侧的排放因子，进而影响两个行业的配额基准。"}],"methods":[{"t":"总排放","d":"E = Q_f × NCV × CC × OX × 44/12，只由燃料投入决定。"},{"t":"排放强度","d":"EF = E ÷ Q_e = (CC × OX × 44/12) ÷ η，效率进入分母。"},{"t":"发电量","d":"Q_e = Q_f × NCV × η。"},{"t":"卡诺效率","d":"η_max = 1 − T_cold/T_hot，给出热机效率的理论上限。"}],"future":"转换环节的演化方向是「去热机化」：用不经过热机的技术（风、光、水、核）替代燃烧。这不是效率的渐进改进，而是路径的替换。相应的政策含义也不同——提效政策作用于存量机组，去碳化政策作用于增量结构，两者不可互相替代。","domains":[{"no":"03","name":"能源市场与价格","accent":"#f97316"},{"no":"08","name":"能源技术","accent":"#22d3ee"}],"questions":[{"id":"01-05","q":"新能源装机增长是否真正转化为有效能源供给？弃风、弃光、利用小时数如何变化？","layer":"L2","status":"可算"},{"id":"05-06","q":"煤炭替代、能源电气化、节能改造和产业升级分别贡献了多少减排？","layer":"L2","status":"部分可算"},{"id":"08-02","q":"各种能源技术的全生命周期成本（LCOE）如何变化？","layer":"L1","status":"部分可算"}]},{"id":"K06","part":"P2","title":"能源平衡","sub":"一张表如何锁住所有的账","concepts":[{"t":"能源平衡表","d":"按「供给—转换—终端消费—损失—库存变化」编制的实物量与标准量矩阵。它是所有能源核算的底表，也是唯一能做交叉校验的工具。"},{"t":"折标准煤系数","d":"把不同品种折算为统一单位的系数。同一品种的折标系数会随统计口径调整，跨年比较前必须确认系数是否变化。"},{"t":"加工转换投入 / 产出","d":"炼油、发电、供热、炼焦等环节的投入与产出分别列示，差额即转换损失。这是「一次能源消费」与「终端消费」之差的主要来源。"}],"first":"能源平衡表的第一性原理是**守恒**：供给 = 转换投入 + 终端消费 + 损失 + Δ库存。等式不成立，说明不是数据有误差，而是口径不一致或某环节漏记。因此平衡表的价值不在于「有多少数据」，而在于它提供了一个**任何数字都必须通过的校验关卡**。","mechanism":[{"t":"供给端","d":"本地生产 + 进口 + 调入 − 出口 − 调出。"},{"t":"转换端","d":"各转换环节的投入与产出，差额为损失。"},{"t":"终端端","d":"按行业与用途分列的最终消费。"},{"t":"校验","d":"两端相减，差额应等于库存变化；不为零则逐项排查。"}],"history":[{"t":"实物量平衡表","d":"早期以实物量为主，便于核对但无法加总。"},{"t":"标准量平衡表","d":"引入折标系数后可加总，成为国际比较基础。"},{"t":"分省平衡表","d":"省级编制，覆盖不全；多数城市根本没有独立平衡表。"},{"t":"城市级自编","d":"需自行编制，是当前最大的数据缺口之一。"}],"status":[{"name":"全国能源消费（2025）","val":"61.7 亿tce，同比 +3.5%","src":"B-03","srcTitle":"能源消费总量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"煤炭消费占比（2025）","val":"51.4%，同比 −1.8pp","src":"B-04","srcTitle":"煤炭消费占比","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"分行业消费的统计限制","val":"分行业能源消费量不能简单按品种相加，加工转换存在统计处理差异","src":"","srcTitle":"","srcUrl":""}],"tension":[{"t":"城市级平衡表普遍缺失","d":"多数城市不编制独立能源平衡表，导致城市层面的能源流无法闭合，这是城市碳核算最难的一步。"},{"t":"折标系数变动","d":"系数调整会同时改变历史与当期数据，造成「统计性」的强度变化，与真实的效率改善混在一起难以区分。"},{"t":"分行业加总 ≠ 总量","d":"行业分类与品种分类是两个维度，交叉表存在未分配项，强行加总会出现「分项之和大于总量」的怪象。"}],"methods":[{"t":"平衡表恒等式校验","d":"供给 = 转换投入 + 终端消费 + 损失 + Δ库存。"},{"t":"部门分类映射","d":"统计年鉴部门分类 ↔ IPCC ↔ GPC 三套分类的对照表，跨库分析的前置条件。"},{"t":"城市级编制法","d":"先取供应总量与重点企业消费，再按明确假设分配剩余，最后与总量做平衡校验。"},{"t":"折标系数敏感性","d":"换用不同系数口径，看结论是否稳健。"}],"future":"能源平衡表正在从「统计产品」变成「核算基础设施」。碳市场、碳双控、碳排放预算都需要以平衡表为基础。因此城市级平衡表的编制能力，将直接决定地方能否承接碳排放双控的考核。","domains":[{"no":"02","name":"能源需求","accent":"#fb923c"},{"no":"05","name":"能源与碳排放","accent":"#c084fc"}],"questions":[{"id":"05-01","q":"各地区、各行业、各能源品种分别产生多少碳排放？","layer":"L1","status":"可算"},{"id":"05-05","q":"碳排放强度下降是否意味着碳排放总量下降？","layer":"L2","status":"可算"}]},{"id":"K07","part":"P2","title":"能源—经济耦合","sub":"能源如何进入经济增长的方程","concepts":[{"t":"投入产出表","d":"刻画部门间中间投入关系的矩阵。能源既是独立部门，又是所有部门的投入品，因此它在投入产出表中有双重身份。"},{"t":"能源成本份额","d":"能源成本 ÷ 总成本。份额越高，能源价格冲击的传导越强。中国制造业的能源成本份额通常在 3–8%，但行业间差异极大。"},{"t":"全要素生产率 TFP","d":"剔除资本与劳动投入后的残差。能源价格上升会通过「资本闲置 + 技术选择偏移」影响 TFP。"}],"first":"能源进入经济系统有两条通道：**成本通道**（作为投入品推高生产成本）与**需求通道**（作为产业拉动投资与就业）。两条通道的方向相反：能源涨价对前者是负向冲击，对后者（若涨价源于投资扩张）可能是正向的。因此「能源价格上升对 GDP 的影响」没有唯一答案，取决于冲击来源是供给还是需求。","mechanism":[{"t":"成本通道","d":"能源涨价 → 部门成本上升 → 产出价格上升 → 需求下降 → 产出收缩。"},{"t":"投资通道","d":"能源投资扩张 → 设备需求上升 → 上游产业受益 → 短期拉动增长。"},{"t":"贸易通道","d":"能源密集产品出口竞争力变化 → 贸易结构与汇率受影响。"},{"t":"分配通道","d":"成本上升在不同收入群体间的分摊不均，影响实际消费。"}],"history":[{"t":"能源密集增长","d":"重工业化阶段，能源消费与 GDP 高度同步。"},{"t":"脱钩起步","d":"服务业占比上升，能源消费弹性下降。"},{"t":"双碳约束期","d":"碳成本进入价格，能源—经济关系从「投入关系」变为「约束关系」。"}],"status":[{"name":"能源消费（2025）","val":"61.7 亿tce，同比 +3.5%；同期 GDP 增速约 5%","src":"B-03","srcTitle":"能源消费总量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"万元 GDP 能耗（2025）","val":"−5.1%","src":"B-08","srcTitle":"万元 GDP 能耗 / 碳排放降幅","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"市场化交易电量占比（2025）","val":"64.0%，价格信号覆盖面扩大","src":"D-04","srcTitle":"市场化交易电量 / 占比","srcUrl":"https://www.nea.gov.cn/20260130/b5b729cb7ad74723bcd614b663c75da6/c.html"}],"tension":[{"t":"方向识别困难","d":"能源消费与 GDP 高度相关，但相关方向不明——是能源推动增长，还是增长带动能源消费？这决定政策应该保供还是节能。"},{"t":"传导时滞","d":"能源价格冲击对产出的影响通常在 2–4 个季度后达峰，短期数据看不到全貌。"},{"t":"反弹效应","d":"能效提升降低单位成本，扩大产出，总能耗降幅小于工程测算（见 K10）。"}],"methods":[{"t":"投入产出价格模型","d":"Δp = Δc·(I−A)⁻¹，测算能源涨价的部门成本传导。"},{"t":"SVAR / 局部投影","d":"识别能源价格冲击的宏观动态响应，需明确识别假设。"},{"t":"面板协整 / ARDL","d":"检验能源消费与增长的长期关系与短期调整速度。"},{"t":"增长核算","d":"把增长拆成资本、劳动、能源与 TFP，判断能源约束的边际影响。"}],"future":"能源与经济的耦合正在从「量的耦合」转向「价的耦合」：过去看能源消费增速与 GDP 增速的关系，现在看碳价与电价如何进入企业成本。这意味着宏观分析必须纳入能源价格与碳价变量，而不只是能源数量。","domains":[{"no":"06","name":"能源与宏观经济","accent":"#818cf8"}],"questions":[{"id":"06-01","q":"能源价格冲击对 GDP、通货膨胀、工业生产和居民消费有什么影响？","layer":"L3","status":"部分可算"},{"id":"06-02","q":"能源成本变化如何影响企业生产率和国际竞争力？","layer":"L3","status":"部分可算"},{"id":"06-05","q":"能源消费与经济增长之间是否存在双向因果关系？","layer":"L2","status":"可算"},{"id":"06-06","q":"能源效率提高是否会产生反弹效应？程度有多大？","layer":"L2","status":"部分可算"}]},{"id":"K08","part":"P3","title":"碳排放","sub":"从燃料里的碳，到大气里的碳","concepts":[{"t":"排放因子 / 氧化率","d":"排放因子是单位活动水平的排放量；氧化率是燃料中碳实际被氧化的比例。二者相乘才是「真正进入大气的碳」。"},{"t":"范围一 / 二 / 三","d":"直接排放、外购电热的间接排放、价值链其他间接排放。三个范围的边界不同，加总时必须声明含哪些，否则不可比。"},{"t":"生产端 / 消费端 / 属地","d":"生产端按排放发生地，消费端按最终消费地，属地按行政辖区。三者必然不同，因为隐含碳会随商品与电力跨区流动。"}],"first":"碳排放的第一性原理是**化学计量**：C + O₂ → CO₂ 是定比反应（44/12）。所以燃烧排放的总量由「投入了多少碳」锁定，人能改变的只有投入量与投入的形态。这条约束解释了为什么减排只有三条路：少用碳（节能）、换碳（燃料替代）、不排碳（非化石）。除此之外没有第四条。","mechanism":[{"t":"燃烧排放","d":"燃料碳 × 氧化率 × 44/12。"},{"t":"工艺排放","d":"原料碳酸盐分解，如 CaCO₃ → CaO + CO₂，与能源无关。"},{"t":"逸散排放","d":"CH₄ 等未经燃烧直接泄漏，按 GWP 折算，量小但影响大。"},{"t":"间接排放","d":"外购电热，排放发生在发电端，用电端按因子计价。"}],"history":[{"t":"清单法主导期","d":"以 IPCC 缺省因子为主，重点是「算得出来」。"},{"t":"本地化因子期","d":"分品种、分区域的实测因子替代缺省值。"},{"t":"市场机制期","d":"碳市场与 CCER 出现，排放成为有价格的资产。"},{"t":"消费端核算期","d":"MRIO 引入，开始追问「谁最终消费了这些排放」。"}],"status":[{"name":"电力 CO₂ 因子（2023）","val":"全国 0.5306 kgCO₂/kWh（地理口径）；市场口径 0.6096；化石电源 0.8273","src":"","srcTitle":"","srcUrl":""},{"name":"碳市场规模（2025）","val":"纳管 3,680 家、约 83 亿吨、占全国排放 65% 以上","src":"","srcTitle":"","srcUrl":""},{"name":"CCER（截至 2026-08）","val":"登记 41 个项目 / 2,423.35 万吨；累计发布 18 项方法学","src":"","srcTitle":"","srcUrl":""}],"tension":[{"t":"强度下降不等于总量下降","d":"全国碳强度持续下降，但排放总量仍在增长，临界条件是 GDP 增速 ≤ 碳强度降幅。"},{"t":"口径决定数字","d":"同一城市用地理口径与市场口径算范围二，结果可以差 15% 以上；用电网区域因子与全国因子，差得更远。"},{"t":"生产端与消费端的归属之争","d":"东部消费、西部生产，按属地算西部排放高，按消费算东部排放高。这不是技术问题，是责任分配问题。"}],"methods":[{"t":"IPCC 清单法","d":"活动水平 × 排放因子，逐部门累加。"},{"t":"Kaya 恒等式与 LMDI","d":"把排放变化拆成人口、富裕度、能源强度、碳强度（见 K12）。"},{"t":"MRIO 隐含碳","d":"E = e·(I−A)⁻¹·y，把排放归到最终消费（见 K12）。"},{"t":"MRV 与误差传播","d":"实测与估算的交叉校验，含协方差的不确定性合成。"}],"future":"核算的重心正从「算总量」转向「定责任」。总量已经能算，争议在归属：跨区电力、产业转移、商品贸易都在转移排放。未来碳市场扩容与 CBAM 的实施，会把「用哪套口径」从学术问题变成贸易问题。","domains":[{"no":"05","name":"能源与碳排放","accent":"#c084fc"}],"questions":[{"id":"05-01","q":"各地区、各行业、各能源品种分别产生多少碳排放？","layer":"L1","status":"可算"},{"id":"05-02","q":"碳排放的增长究竟来自能源消费规模扩大、能源结构变化，还是能源效率变化？","layer":"L2","status":"可算"},{"id":"05-03","q":"生产端排放和消费端隐含排放之间存在多大差异？","layer":"L1","status":"部分可算"},{"id":"05-05","q":"碳排放强度下降是否意味着碳排放总量下降？","layer":"L2","status":"可算"},{"id":"05-07","q":"甲烷、非二氧化碳温室气体和能源开采过程中的排放是否被充分纳入？","layer":"L1","status":"部分可算"}]},{"id":"K09","part":"P3","title":"能源安全","sub":"从进口依存度到系统韧性","concepts":[{"t":"对外依存度","d":"净进口 ÷ 表观消费。注意：这不是官方统计指标，由智库/协会测算，是否含成品油、是否含化工轻油各家不同。"},{"t":"来源集中度 HHI","d":"Σ(来源国份额)²。同样的依存度，来源分散与来源集中风险完全不同。"},{"t":"N-1 准则 / LOLP / EENS","d":"失去任一元件不失负荷、失负荷概率、期望缺供电量。三者从不同角度刻画电力系统韧性。"}],"first":"能源安全不是「进口越少越安全」，而是**在冲击下维持服务的能力**。这一定义把安全从「依存度」扩展为三个维度：来源分散度、通道冗余度、系统恢复速度。由此得出一个反直觉结论：新能源替代油气可能降低一种风险（进口依赖），同时引入另一种风险（关键矿产、设备、技术的供应链依赖）——风险是被转移了，不是被消除了。","mechanism":[{"t":"资源风险","d":"储量、产量、品位，属长期约束。"},{"t":"通道风险","d":"航运要道、管道、电网跨区通道，属地理约束。"},{"t":"价格风险","d":"国际价格波动通过进口成本传导，属金融约束。"},{"t":"技术风险","d":"关键设备与材料的外部依赖，属产业约束。"},{"t":"气候风险","d":"极端天气对发电、输电与需求的冲击，属物理约束。"}],"history":[{"t":"自给自足期","d":"安全 = 产量够用。"},{"t":"进口依赖期","d":"安全 = 来源多元 + 战略储备。"},{"t":"系统韧性期","d":"安全 = 电力系统抗扰动 + 关键矿产供应链。"},{"t":"复合风险期","d":"气候、地缘、技术三类风险叠加。"}],"status":[{"name":"原油 / 天然气对外依存度（2025）","val":"72.7% / 40%（智库测算口径）","src":"C-01","srcTitle":"原油对外依存度","srcUrl":"http://paper.people.com.cn/zgnyb/pad/content/202604/06/content_30149922.html"},{"name":"原油进口（2025）","val":"57,773 万吨，同比 +4.4%；天然气 12,787 万吨，−2.8%","src":"C-04","srcTitle":"原油 / 天然气 / 煤及褐煤进口量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"电力现货正式运行（2026-09）","val":"10 省；首批 8 个试点中四川尚未转正","src":"D-01","srcTitle":"电力现货市场正式运行省份","srcUrl":"https://www.cpnn.com.cn/news/dfny/202609/t20260922_1916973_wap.html"}],"tension":[{"t":"依存度之外看不见的风险","d":"原油依存度从 70% 降到 68% 可能只是价格效应，而关键矿产依存度上升往往不被计入「能源安全」。"},{"t":"储备的有效性","d":"储备天数只能应对短期中断，对长期供应格局变化几乎无效。"},{"t":"新能源的风险转移","d":"风光替代煤电降低了燃料风险，但提高了对关键矿产、电力电子设备与极端天气的暴露。"}],"methods":[{"t":"Shannon-Wiener 指数","d":"WS = −Σ(sᵢ ln sᵢ)，把来源分散度数量化。"},{"t":"N-1 与蒙特卡洛","d":"逐元件校验与随机失负荷模拟，评估电力系统韧性。"},{"t":"VaR / CVaR","d":"度量价格与供给的风险敞口，用于储备规模设计。"},{"t":"压力测试","d":"构造地缘/气候情景，测算缺口与替代成本。"}],"future":"安全的评价标准正在从「有多少储备」转向「多快能恢复」。这意味着投资重点从储备设施转向灵活性资源（储能、需求响应、跨区互济）。同时也意味着，能源安全的成本必须显性化——目前它大量隐藏在冗余投资与备用容量中。","domains":[{"no":"07","name":"能源安全","accent":"#60a5fa"}],"questions":[{"id":"07-01","q":"中国能源安全面临哪些主要风险？资源、运输、价格、技术和地缘政治风险分别有多大？","layer":"L1","status":"部分可算"},{"id":"07-02","q":"石油、天然气、煤炭和关键矿产的供应链安全程度如何？","layer":"L1","status":"可算"},{"id":"07-05","q":"新能源替代传统能源后，能源安全风险是降低了，还是转移到了关键矿产、设备和技术供应链？","layer":"L2","status":"部分可算"},{"id":"07-06","q":"电力系统能否抵御极端天气、自然灾害和大规模设备故障？","layer":"L2","status":"缺关键数据"}]},{"id":"K10","part":"P3","title":"能源效率与反弹效应","sub":"为什么省下来的能源又花掉了","concepts":[{"t":"工程节能量 / 实际节能量","d":"前者是技术测算的物理节能量，后者是实际观察到的能耗下降。二者之差就是反弹效应。"},{"t":"直接反弹 / 间接反弹 / 经济层面反弹","d":"同一设备用得更省后多用了（直接）；省下的钱买别的东西（间接）；全国层面的价格与投资调整（经济层面）。"},{"t":"能源生产率","d":"产出 ÷ 能耗，与能源强度互为倒数，但分析视角不同：强度看约束，生产率看贡献。"}],"first":"效率提升降低单位服务成本，而成本下降必然扩大需求——这是**经济学的基本推论，不是行为缺陷**。因此「提高能效就能减少总能耗」这个命题在理论上不成立，只在特定条件下成立：即效率改善速度快于需求扩张速度。这解释了为什么技术进步几十年，能源消费总量仍在增长。","mechanism":[{"t":"价格弹性通道","d":"单位服务成本下降 → 需求量上升 → 部分抵消节能。"},{"t":"收入通道","d":"省下的支出转向其他消费，其中也含能源密集品。"},{"t":"投资通道","d":"节能设备投资本身需要钢铁、水泥等能源密集产品。"},{"t":"结构通道","d":"效率改善的行业扩张更快，总能耗结构反而更能源密集。"}],"history":[{"t":"节能优先期","d":"以行政手段推动节能，主要看工程节能量。"},{"t":"能效双控期","d":"单位 GDP 能耗作为约束性指标（2021 年前）。"},{"t":"碳排放双控期","d":"2024 年国办发 39 号文明确「十五五」不再将能耗强度作为约束性指标，转向以碳排放强度为主、总量为辅。"},{"t":"生产率视角","d":"从「少用」转向「用得更值」，强调全要素能源效率。"}],"status":[{"name":"万元 GDP 能耗（2025）","val":"−5.1%（扣除原料用能和非化石口径）","src":"B-08","srcTitle":"万元 GDP 能耗 / 碳排放降幅","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"能源消费总量（2025）","val":"61.7 亿tce，同比 +3.5%——强度降、总量升同时发生","src":"B-03","srcTitle":"能源消费总量","srcUrl":"https://www.coalchina.org.cn/index.php?m=content&c=index&a=show&catid=9&id=160587"},{"name":"口径变更","val":"2021 年后「扣除原料用能和非化石」成为主流口径，与旧口径不可直接比较","src":"","srcTitle":"","srcUrl":""}],"tension":[{"t":"强度降、总量升","d":"这是反弹效应最直观的证据：强度下降 5.1%，总量仍增长 3.5%，说明分母（GDP）扩张的速度超过了分子改善的速度。"},{"t":"政策工具错配","d":"用能耗强度做约束，会惩罚用能大但产出高的行业，同时豁免原料用能（这部分碳仍在排放），导致约束失效。这也是转向碳双控的原因之一。"},{"t":"测量困难","d":"反弹效应需要同时知道「技术节能量」与「实际消费量」，前者来自工程模型，后者来自统计，二者的口径差本身就很大。"}],"methods":[{"t":"LMDI 分解","d":"把能耗变化拆成规模、结构、强度，强度项即「效率贡献」。"},{"t":"弹性估计","d":"价格弹性 + 收入弹性，估算反弹幅度，通常落在 20–60%。"},{"t":"DEA / SFA","d":"测算全要素能源效率与节能潜力。"},{"t":"指数分解与指数理论","d":"Laspeyres / Paasche / Divisia 的选择会影响结果。"}],"future":"效率政策的表述正在从「节能量」转向「生产率」。这不仅是措辞变化：前者容易被反弹抵消，后者强调同样能源产出更多价值，与产业升级方向一致。相应地，考核指标也应从能耗强度转向能源生产率与碳排放生产率。","domains":[{"no":"02","name":"能源需求","accent":"#fb923c"},{"no":"06","name":"能源与宏观经济","accent":"#818cf8"}],"questions":[{"id":"02-07","q":"电气化率提高是否意味着能源效率提高？是否存在电力消费增长快于终端能效改善的情况？","layer":"L2","status":"可算"},{"id":"06-06","q":"能源效率提高是否会产生反弹效应？程度有多大？","layer":"L2","status":"部分可算"},{"id":"09-05","q":"能源强度控制和碳排放总量控制分别会产生什么经济影响？","layer":"L3","status":"部分可算"}]},{"id":"K11","part":"P3","title":"转型的分配后果","sub":"代价落在谁身上","concepts":[{"t":"资源型城市","d":"采掘业就业占比高、产业单一、财政依赖资源税收的城市。识别阈值须固定（如采掘业就业占比 >15%），否则结论随阈值变化。"},{"t":"碳泄漏","d":"单边碳约束导致高碳产业转移到约束更松的地区，本地减排被外部增排抵消。"},{"t":"转移支付 / 公正转型","d":"对受损群体与地区的补偿机制，包括就业安置、财政转移、产业替代。"}],"first":"转型的**总量效应**与**分配效应**是两个独立问题。总量上社会可能净受益，但成本会集中在少数地区与群体身上——而这些群体的政治影响力往往足以阻滞转型。因此公正转型不是道德附加项，而是转型能否推进的**约束条件**。","mechanism":[{"t":"区域维度","d":"资源型地区承担就业与财政冲击，消费型地区承担成本上升。"},{"t":"行业维度","d":"煤炭、煤电收缩，新能源制造扩张，技能不通用导致结构性失业。"},{"t":"群体维度","d":"低收入家庭的能源支出占比更高，能源涨价对其实际收入冲击更大。"},{"t":"代际维度","d":"转型投资的前期成本由当代承担，收益跨代分布。"}],"history":[{"t":"增量转型期","d":"新能源增量满足新增需求，传统能源不受冲击，矛盾不显。"},{"t":"存量替代期","d":"新能源开始替代存量，煤电利用小时下降，矛盾显性化。"},{"t":"结构调整期","d":"资源型地区财政与就业承压，需要转移支付与产业替代。"}],"status":[{"name":"风光装机（2025）","val":"18.4 亿kW 首超火电——存量替代已经开始","src":"A-11","srcTitle":"风电 / 光伏装机","srcUrl":"https://www.nea.gov.cn/20260129/6874f211acd0417eab7ac10c3061a7c2/c.html"},{"name":"原油对外依存度（2025）","val":"72.7%，转型同时意味着进口替代收益","src":"C-01","srcTitle":"原油对外依存度","srcUrl":"http://paper.people.com.cn/zgnyb/pad/content/202604/06/content_30149922.html"},{"name":"就业数据缺口","val":"煤炭就业、转岗成本、区域财政依赖度均无统一公开口径","src":"","srcTitle":"","srcUrl":""}],"tension":[{"t":"成本集中、收益分散","d":"减排收益是全局的、长期的；成本是局部的、当期的。这种不对称是转型阻力的结构性来源。"},{"t":"补偿机制缺乏量化依据","d":"转移支付规模通常按政治协商确定，而非按测算的损失确定。"},{"t":"区域差距可能扩大","d":"新能源资源富集区与负荷中心分离，若输电收益分配不合理，西部仍可能「送电不送增加值」。"}],"methods":[{"t":"投入产出区域分解","d":"测算能源投资对各地增加值与就业的拉动。"},{"t":"合成控制 / DID","d":"评估资源型城市在政策冲击下的增长轨迹偏离。"},{"t":"基尼系数与支出份额","d":"衡量能源成本上升的分配效应。"},{"t":"空间计量","d":"识别区域溢出与产业转移路径。"}],"future":"公正转型的政策工具箱目前还很薄：主要是财政转移与就业培训，缺少与碳价收入挂钩的自动稳定机制。一个可操作的方向是把碳市场有偿分配收入定向用于资源型地区转型，使补偿规模随碳价自动调整。","domains":[{"no":"10","name":"区域能源经济","accent":"#34d399"},{"no":"04","name":"能源产业","accent":"#fb7185"}],"questions":[{"id":"08-07","q":"哪些技术已经具备商业化能力，哪些仍处于实验室或示范阶段？","layer":"L1","status":"部分可算"},{"id":"10-07","q":"新能源开发是否能够缩小区域经济差距？","layer":"L3","status":"部分可算"},{"id":"04-06","q":"能源转型会导致哪些传统行业收缩，又会催生哪些新产业？就业净效应是多少？","layer":"L3","status":"缺关键数据"}]},{"id":"K12","part":"P4","title":"分解与归因","sub":"把变化拆成可以负责的部分","concepts":[{"t":"Kaya 恒等式","d":"C = P × (GDP/P) × (E/GDP) × (C/E)。四个乘数分别对应人口、富裕度、能源强度、碳强度。恒等式只做拆分，本身不含因果。"},{"t":"LMDI","d":"对数平均迪氏指数法。无残差、可完全加和，因此分解结果可以直接用于归因陈述。"},{"t":"SDA","d":"结构分解分析。基于投入产出，能分离技术效应与最终需求结构效应。"}],"first":"分解分析的第一性原理是**会计恒等**：总量变化必然等于各因素贡献之和。它的价值在于把「说不清的变化」变成「可分别讨论的部分」，但它**不提供因果识别**——说「结构效应贡献 60%」是会计归因，不是「结构调整导致 60% 的减排」。混淆这两者是能源经济文献中最常见的错误之一。","mechanism":[{"t":"加法分解","d":"ΔC = ΣΔCᵢ，各因素贡献以绝对量表示，可加和等于总变化。"},{"t":"乘法分解","d":"各因素以比值形式表示，乘积等于总变化率。"},{"t":"残差处理","d":"Laspeyres 类分解有残差，LMDI 无残差——这是 LMDI 被广泛采用的主因。"},{"t":"权重函数","d":"L(a,b) = (a−b)/(ln a − ln b)，是 LMDI 保证完全加和的关键。"}],"history":[{"t":"指数分解兴起","d":"1970s 石油危机后，需要解释能耗变化来源。"},{"t":"LMDI 成为标准","d":"Ang 2005 的实用指南使其成为事实标准。"},{"t":"SDA 与 IO 结合","d":"投入产出表普及后，结构效应可被更细地分离。"},{"t":"与因果方法结合","d":"近年趋势是把分解结果作为因果分析的因变量。"}],"status":[{"name":"中国排放增长的分解","val":"多数研究发现规模效应为正、强度效应为负，净效应取决于二者相对大小","src":"","srcTitle":"","srcUrl":""},{"name":"电力部门分解","val":"煤电占比下降（结构效应）与供电煤耗下降（强度效应）贡献不同","src":"","srcTitle":"","srcUrl":""},{"name":"区域差异","val":"东部以强度效应为主，西部以规模效应为主","src":"","srcTitle":"","srcUrl":""}],"tension":[{"t":"归因 ≠ 因果","d":"「某效应贡献 X%」是会计陈述；要说因果必须另做识别。"},{"t":"基期选择敏感","d":"不同基期会得到不同的贡献排序，尤其在经济波动年份。"},{"t":"因素划分主观","d":"拆成几项、如何定义「结构」，会直接影响结论。"}],"methods":[{"t":"LMDI 加法/乘法分解","d":"ΔC_x = Σ L(wᵗ,w⁰)·ln(xᵗ/x⁰)。"},{"t":"SDA","d":"基于 (I−A)⁻¹ 的一阶差分分解。"},{"t":"Shapley 分解","d":"处理交互项的一种方式，结果与分解顺序无关。"},{"t":"指数理论","d":"Laspeyres / Paasche / Fisher / Törnqvist 的选择与比较。"}],"future":"分解分析正在与因果方法合流：先用分解定位「哪一项在动」，再用 DID 或合成控制判断「这一项为什么动」。单用分解只能描述，单用因果难以定位，二者结合才是完整解释。","domains":[{"no":"06","name":"能源与宏观经济","accent":"#818cf8"},{"no":"05","name":"能源与碳排放","accent":"#c084fc"}],"questions":[{"id":"05-02","q":"碳排放的增长究竟来自能源消费规模扩大、能源结构变化，还是能源效率变化？","layer":"L2","status":"可算"},{"id":"06-07","q":"能源转型是否会改变资本配置、产业分工和地区经济增长模式？","layer":"L3","status":"部分可算"},{"id":"12-10","q":"历史上能源转型的驱动机制是什么？跨国经验能否外推到中国？","layer":"L2","status":"部分可算"}]},{"id":"K13","part":"P4","title":"成本与技术","sub":"LCOE 解决了什么，又误导了什么","concepts":[{"t":"LCOE 平准化度电成本","d":"全生命周期成本现值 ÷ 全生命周期发电量现值。本质是把不同时间点的成本与电量折算到同一基准后相除。"},{"t":"学习率","d":"LR = 1 − 2^b，累计产量翻倍时成本下降的比例。是外推技术成本趋势的核心参数。"},{"t":"MACC 边际减排成本曲线","d":"把减排技术按单位成本升序排列，曲线下的面积即总减排成本。"}],"first":"LCOE 的第一性原理是**把不可比的成本变成可比**：不同技术寿命不同、燃料成本不同、建设期不同，直接比「每千瓦投资」毫无意义。LCOE 用折现把时间维度压平。但压平的同时也引入了新问题：**它对折现率与利用小时极度敏感**，换一个假设，技术排序就可能反转。因此 LCOE 是「在给定假设下的比较」，不是「客观成本」。","mechanism":[{"t":"投资成本","d":"单位装机造价，随规模与学习效应下降。"},{"t":"运维成本","d":"固定 + 可变，随技术成熟度下降。"},{"t":"燃料成本","d":"仅化石能源有，是 LCOE 差异的主要来源。"},{"t":"折现率","d":"决定未来成本与电量的权重，是 LCOE 最敏感的假设。"},{"t":"利用小时","d":"分母的核心，风光与火电差 3–5 倍。"}],"history":[{"t":"工程成本法","d":"早期只看单位投资，忽略运行与寿命差异。"},{"t":"LCOE 标准化","d":"IRENA 等机构统一口径，使跨国跨技术比较成为可能。"},{"t":"系统成本视角","d":"发现 LCOE 不含并网、调峰、备用成本，低估高比例新能源的系统成本。"},{"t":"价值调整 LCOE","d":"引入「价值因子」，按发电时段的价格调整，反映市场价值。"}],"status":[{"name":"光伏 LCOE（2024）","val":"中国 0.033 美元/kWh（IRENA；全球加权平均 0.043）","src":"E-01","srcTitle":"集中式光伏 LCOE","srcUrl":"https://energy.pku.edu.cn/xsdt/sznyyw/d133q/nyzxyw202518/67813d0205414cad9d0f5f9bf1d59d3f.htm"},{"name":"陆上风电 LCOE（2024）","val":"中国 0.029 美元/kWh（全球平均 0.034）","src":"E-02","srcTitle":"陆上风电 LCOE","srcUrl":"https://energy.pku.edu.cn/xsdt/sznyyw/d133q/nyzxyw202518/67813d0205414cad9d0f5f9bf1d59d3f.htm"},{"name":"新型储能（2025）","val":"1.36 亿kW / 3.51 亿kWh，平均时长 2.58 h，等效利用 1,195 h","src":"E-04","srcTitle":"新型储能累计装机 / 时长","srcUrl":"https://www.nea.gov.cn/20260130/50f657ce87f848e1a9a1861d1fd9aa23/c.html"}],"tension":[{"t":"LCOE 忽略系统成本","d":"高比例新能源需要配套储能、调峰与输电，这些成本不计入 LCOE，导致「新能源很便宜」的判断偏乐观。"},{"t":"折现率操纵空间","d":"把折现率从 5% 调到 8%，煤电与光伏的相对优势可能逆转。"},{"t":"学习率外推的风险","d":"历史学习率依赖规模扩张，规模停滞时学习率会下降；外推到 2060 年需谨慎。"},{"t":"MACC 的静态缺陷","d":"技术间存在相互依赖（如储能与光伏），单独排序会高估总成本。"}],"methods":[{"t":"LCOE","d":"Σ(Cₜ+Oₜ)/(1+r)ᵗ ÷ Σ(Eₜ/(1+r)ᵗ)。"},{"t":"LCOS 储能度电成本","d":"(投资+运维+充电) ÷ 全生命周期放电量。"},{"t":"学习曲线","d":"C = C₀·Q^b，LR = 1 − 2^b。"},{"t":"MACC","d":"MACᵢ = ΔCostᵢ/ΔAbateᵢ；最优条件 λ = MAC(Q*)。"}],"future":"成本分析的焦点正在从 LCOE 转向**系统成本**与**价值**：同样的电量，在正午光伏大发时与晚峰时的价值完全不同。这意味着未来技术评价必须与电力市场结构耦合，孤立的 LCOE 排序会越来越失真。","domains":[{"no":"08","name":"能源技术","accent":"#22d3ee"},{"no":"04","name":"能源产业","accent":"#fb7185"}],"questions":[{"id":"08-02","q":"各种能源技术的全生命周期成本（LCOE）如何变化？","layer":"L1","status":"部分可算"},{"id":"08-04","q":"绿氢与传统化石能源制氢相比，何时能够实现经济竞争力？","layer":"L2","status":"部分可算"},{"id":"04-05","q":"能源技术进步如何改变能源生产成本和产业竞争力？","layer":"L2","status":"部分可算"}]},{"id":"K14","part":"P4","title":"因果识别与情景","sub":"没有反事实，就没有影响","concepts":[{"t":"反事实","d":"「如果没有这个政策，会发生什么」。影响 = 观测值 − 反事实值。没有反事实，只有状态差异。"},{"t":"平行趋势 / 合成控制","d":"构造反事实的两种主流方式：前者要求处理组与对照组事前趋势一致，后者用加权组合构造一个「合成的对照地区」。"},{"t":"情景 vs 预测","d":"预测问「会怎样」，情景问「如果这样会怎样」。情景的输出是一组条件结论，不是单一数值。"}],"first":"评估方法的第一性原理是**反事实的可得性**。政策只实施一次，我们永远看不到「同一个地区在同一时间没有政策」的样子。所以所有因果方法本质上都在做一件事：**用某种可辩护的方式构造那个不存在的对照组**。方法选择的依据不是先进程度，而是「哪种构造在你的数据条件下更可信」。","mechanism":[{"t":"DID","d":"处理组与对照组的事前趋势一致时可用；交错处理下 TWFE 权重可为负。"},{"t":"事件研究","d":"把效应按相对政策年份展开，可同时检验事前趋势。"},{"t":"合成控制","d":"处理组只有一个或很少时使用，用多个对照地区加权合成。"},{"t":"情景模型","d":"LEAP/IAM 类，按部门活动量 × 强度逐层累加，输出路径而非点值。"}],"history":[{"t":"前后对比","d":"最简单但最不可信，把所有同期变化都归给政策。"},{"t":"DID 普及","d":"面板数据可得后成为主流。"},{"t":"交错处理修正","d":"Goodman-Bacon、Callaway–Sant'Anna 等指出并修正 TWFE 偏误。"},{"t":"多模型比较","d":"情景分析从单模型走向多模型区间。"}],"status":[{"name":"碳市场因果评估困难","val":"2021 年起全国推开，处理组几乎覆盖全部重点排放单位，对照组难找","src":"","srcTitle":"","srcUrl":""},{"name":"省级试点可作处理组","val":"但存在省际溢出，SUTVA 假设可能不成立","src":"","srcTitle":"","srcUrl":""},{"name":"情景假设的透明性","val":"假设表不完整的情景结论无法复现，也无法反驳","src":"","srcTitle":"","srcUrl":""}],"tension":[{"t":"TWFE 权重为负","d":"交错处理下，早期处理组会被用作后期处理组的对照，导致偏误。应改用 Callaway–Sant'Anna 或 Sun–Abraham 估计量。"},{"t":"政策时点定义","d":"发文日 ≠ 生效日 ≠ 数据可见日，选错时点会系统性偏移效应估计。"},{"t":"情景不是预测","d":"把情景结果当作预测来传播，是能源研究中最常见的越界。"}],"methods":[{"t":"DID / 事件研究 / 合成控制","d":"见上。"},{"t":"局部投影","d":"yₜ₊ₕ = αₕ + βₕ·shockₜ + controls，估计动态响应。"},{"t":"LEAP / IAM","d":"部门法累加，需与能源平衡、电力平衡做一致性校验。"},{"t":"蒙特卡洛 / 贝叶斯","d":"把点估计变成区间，输出分位数而非单一值。"}],"future":"能源政策评估正在从「事后归因」扩展到「事前可评估」：政策设计阶段就明确对照组、指标与评估窗口。这意味着政策文件本身需要包含可评估性设计——这是目前最缺的一环。","domains":[{"no":"09","name":"能源政策与制度","accent":"#2dd4bf"},{"no":"12","name":"未来预测与情景","accent":"#84cc16"}],"questions":[{"id":"09-03","q":"全国碳市场如何影响企业能源消费和技术投资决策？","layer":"L3","status":"部分可算"},{"id":"12-01","q":"2030、2035、2060 年中国能源消费总量和结构可能如何变化？","layer":"L4","status":"部分可算"},{"id":"12-05","q":"如果新能源发展不及预期，能源系统会面临什么风险？","layer":"L4","status":"部分可算"}]},{"id":"K15","part":"P5","title":"碳定价","sub":"税、市场与信用，三种工具解决同一个问题","concepts":[{"t":"碳税 / 碳市场 / 碳信用","d":"税定价格不定数量；市场定数量不定价格；信用是抵消机制，用于降低履约成本。三者不是替代关系，而是组合关系。"},{"t":"配额总量 / 强度基准","d":"总量控制管结果，强度控制管过程。强度法在经济增长下不保证总量下降，这是它最终要转向总量法的原因。"},{"t":"额外性","d":"碳信用的全部价值来源：如果「没有这个项目减排照样发生」，信用就是凭空印出来的钱。"}],"first":"碳定价的第一性原理是**外部成本内部化**：把排放的社会成本变成企业的私人成本，使各主体的边际减排成本趋于相等。但「相等」只在完全竞争与无扭曲时成立；现实中存在免费配额、价格管制与市场力，所以碳价 ≠ 边际减排成本 ≠ 履约成本 ≠ 社会碳成本（SCC）。把这四个概念混用，是碳定价讨论中最普遍的错误。","mechanism":[{"t":"总量设定","d":"决定稀缺性，是价格的基础。"},{"t":"分配方式","d":"免费/有偿，决定成本在谁身上，也决定财政收入。"},{"t":"价格稳定机制","d":"价格上下限、市场稳定储备，应对流动性不足与投机。"},{"t":"抵消机制","d":"CCER 等，降低履约成本，但会削弱本地减排激励。"}],"history":[{"t":"试点期","d":"2013–2021，七省市试点，探索配额分配与 MRV。"},{"t":"发电行业全国市场","d":"2021 年上线，仅发电行业，强度法。"},{"t":"扩围期","d":"2025 年纳入钢铁、水泥、铝冶炼，覆盖排放占比升至 65% 以上。"},{"t":"转总量法","d":"官方明确 2030 年建成以总量控制为基础、免费与有偿相结合的市场。"}],"status":[{"name":"2026 配额方法","val":"发电用强度基准法 A = A_e + A_h；钢铁/水泥/铝冶炼用强度系数法 A = E × (1 + α)","src":"","srcTitle":"","srcUrl":""},{"name":"α 方向","val":"α > 0 表示企业强度优于基准、形成盈余（奖励先进）；α < 0 形成缺口","src":"","srcTitle":"","srcUrl":""},{"name":"2025 价格","val":"加权均价 62.36 元/吨，年末收盘 74.63 元/吨，区间 50.34–97.01","src":"D-06","srcTitle":"全国碳市场配额价格（2025）","srcUrl":"https://www.stcn.com/article/detail/3566947.html"},{"name":"CCER（2025）","val":"均价 70.76 元/吨，高于同期配额均价 62.36 元/吨","src":"","srcTitle":"","srcUrl":""}],"tension":[{"t":"四个「碳成本」不可互换","d":"碳价、边际减排成本、履约成本、社会碳成本是四个不同概念，政策讨论中经常被当作同义词使用。"},{"t":"强度法不封顶总量","d":"经济增长时配额随产量增长，总量不降。这是强度法最大的理论缺陷。"},{"t":"CCER 溢价","d":"CCER 价格高于配额，说明市场对「可注销的绿色资产」有额外支付意愿，这不完全由履约需求解释。"},{"t":"CBAM 与国内碳价","d":"CBAM 按出口产品隐含排放扣减已付碳价，国内碳价越低，出口碳成本越高。"}],"methods":[{"t":"配额盈缺","d":"缺口 = E − A；履约成本 ≈ 缺口 × 碳价。"},{"t":"α 与偏离度","d":"X = (BP − I)/BP；−20%<X<20% → α=0.15X；X≥20% → +0.03；X≤−20% → −0.03。"},{"t":"碳价传导率","d":"终端价格变化 ÷ 能源投入成本变化。"},{"t":"影子价格","d":"约束的拉格朗日乘子 λ = MAC(Q*)，理论上应等于碳价，实际常偏离。"}],"future":"碳定价的演化方向是「从免费到有偿、从强度到总量、从电力到全工业」。每一步都会遇到同一个问题：**成本如何分配**。有偿分配比例的决定，本质上是财政收入与产业竞争力之间的取舍，而不是环境政策的技术选择。","domains":[{"no":"09","name":"能源政策与制度","accent":"#2dd4bf"},{"no":"05","name":"能源与碳排放","accent":"#c084fc"}],"questions":[{"id":"09-03","q":"全国碳市场如何影响企业能源消费和技术投资决策？","layer":"L3","status":"部分可算"},{"id":"09-04","q":"CCER、绿证、绿电交易和碳排放权交易之间是什么关系？是否存在重复计算？","layer":"L2","status":"部分可算"},{"id":"09-05","q":"能源强度控制和碳排放总量控制分别会产生什么经济影响？","layer":"L3","status":"部分可算"}]},{"id":"K16","part":"P5","title":"转型路径与政策冲突","sub":"保供、降成本、减排，三者不可同时最优","concepts":[{"t":"多目标冲突","d":"能源保供、降低用能成本、减少排放三个目标之间存在内在张力，任意两者可以同时改善，三者同时最优通常不可行。"},{"t":"Pareto 前沿","d":"在多目标优化中，不存在「全面更优」的解集，只有「不能在不牺牲其他目标的前提下继续改善」的解集。"},{"t":"路径依赖 / 锁定效应","d":"已建成的资本存量（电厂、电网、工业设备）决定了未来 20–40 年的排放，因此「什么时候建什么」比「建成后怎么用」更重要。"}],"first":"政策冲突的第一性原理是**约束的不可同时满足**：在给定技术与资本存量下，提高保供可靠性需要冗余投资（推高成本），降低成本需要压低价格（抑制投资），减排需要提高碳价（推高成本）。所以政策设计的核心不是「找到最优解」，而是**明确在什么时期优先哪个目标，并说清代价**。","mechanism":[{"t":"短期保供优先","d":"能源紧张时压价格、保供应，减排目标暂时让位。"},{"t":"中期成本优先","d":"经济下行时补贴与降电价，投资信号被削弱。"},{"t":"长期减排优先","d":"碳约束收紧，成本上升，需要分配机制缓冲。"},{"t":"制度协调","d":"发改、能源、生态环境、财政多部门目标不一致，需要机制协调。"}],"history":[{"t":"保供主导期","d":"以「有没有」为核心，价格与排放都是次要的。"},{"t":"效率优先期","d":"能耗双控成为约束，效率成为主要抓手。"},{"t":"双碳约束期","d":"碳排放双控，碳市场扩围，减排进入成本函数。"},{"t":"多目标权衡期","d":"保供、成本、减排、公正转型同时被要求，需要显性权衡。"}],"status":[{"name":"碳双控转型","val":"国办发〔2024〕39号：「十五五」以强度为主、总量为辅，不再将能耗强度作为约束性指标","src":"F-04","srcTitle":"《加快构建碳排放双控制度体系工作方案》","srcUrl":"https://www.gov.cn/zhengce/zhengceku/202408/content_6966080.htm"},{"name":"新能源电价改革","val":"发改价格〔2025〕136号：存量机制电价不高于当地煤电基准价，增量由年度竞价形成","src":"F-05","srcTitle":"新能源上网电价市场化改革通知","srcUrl":"https://www.gov.cn/zhengce/zhengceku/202502/content_7002959.htm"},{"name":"CBAM 正式征收","val":"2026-01-01 起；50 吨门槛；六行业；证书按 EU ETS 拍卖价","src":"F-01","srcTitle":"CBAM 过 const K = DATA.k, T = DATA.tools;
const PARTS = {}; K.parts.forEach(p=>PARTS[p.id]=p);

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* 支持 **强调** 行内标记（先转义再替换，避免注入） */
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b style="color:#7dd3fc">$1</b>');}

function drawTOC(){
  document.getElementById('toc').innerHTML = K.parts.map(p=>`

  document.getElementById('toc').addEventListener('click', e=>{

}

  const S = K.sectionNames;
  const sec = (i, body)=>({i, body});

  const concepts = `<div class="defs">${m.concepts.map(c=>

  const first = `<div class="firstbox">${fmt(m.first)}</div>`;
  const mech = `<div class="mech">${m.mechanism.map(x=>
    `<div class="mech-row"><div class="mech-k">${esc(x.t)}</div>

        <h2>数据资源库（${T.datasets.length} 个数据集）</h2>
        <div class="lead">每条登记发布机构、频率、覆盖与<b>已知口径局限</b>。
        能源经济研究里最常见的错误不是算错，而是把两个不同口径的数放在一起比。</div>
        <table class="tbl">
          <tr><th style="width:5%">编号</th><th style="width:19%">名称</th><th style="width:14%">发布机构</th>
              <th style="width:6%">频率</th><th style="width:9%">覆盖</th><th>口径 / 已知局限</th></tr>
          ${T.datasets.map(d=>`<tr><td class="num">${d.id}</td>
            <td><b>${esc(d.name)}</b></td><td style="font-size:12.5px">${esc(d.org)}</td>
            <td style="font-size:12.5px">${esc(d.freq)}</td>
            <td style="font-size:12.5px">${esc(d.cover)}</td>
            <td style="font-size:12.5px;color:#a9bfdc">${esc(d.caveat)}</td></tr>`).join('')}
        </table>
      </div>`;
  } else if(refView==='model'){
    box.innerHTML = `
      <div class="card">
        <h2>方法库（${T.models.length} 个模型）</h2>
        <div class="lead">每个模型登记数学形式与<b>适用限度</b>。选模型的原则是先定用途再选族：
        解释用简约模型，预测用结构模型，评估用反事实模型——用错族比算错参数更致命。
        要理解模型背后的逻辑，请读 K12–K14。</div>
        <table class="tbl">
          <tr><th style="width:6%">编号</th><th style="width:16%">名称</th><th style="width:7%">类别</th>
              <th style="width:19%">适用问题</th><th>数学形式 / 适用限度</th></tr>
          ${T.models.map(m=>`<tr><td class="num">${m.id}</td>
            <td><b>${esc(m.name)}</b></td><td style="color:#a78bfa;font-size:12.5px">${esc(m.kind)}</td>
            <td style="font-size:12.5px">${esc(m.use)}</td>
            <td><div class="formula" style="font-size:11.5px">${esc(m.formula)}</div>
              <div style="font-size:11.5px;color:#fbbf24;margin-top:5px">限度：${esc(m.limit)}</div></td></tr>`).join('')}
        </table>
      </div>`;
  } else {
    const A = T.anchors;
    box.innerHTML = `
      <div class="card" style="border-left:3px solid #a78bfa">
        <h2>还要看分析视图？</h2>
        <div class="lead">本页「支撑材料」是查询用的精简版。完整的 12×4 分析矩阵、
        107 条研究问题的筛选器、数据锚点台账与四标准任务表在独立分析页里。</div>
        <a href="explorer.html" style="display:inline-block;background:#17305a;border:1px solid #3f5c8f;
           color:#7dd3fc;border-radius:10px;padding:10px 18px;text-decoration:none;font-size:13.5px">
          打开完整分析视图 →</a>
      </div>
      <div class="card">
        <h2>证据与来源（${A.length} 条数据锚点）</h2>
        <div class="lead">知识模块「当前发展状态」里的每个数值，都应能在本表找到对应行与来源链接。
        标注「部分核实 / 计算值」的条目，其可信度低于一手官方数据。</div>
        <table class="tbl">
          <tr><th style="width:5%">编号</th><th style="width:14%">指标</th><th style="width:16%">数值</th>
              <th style="width:6%">年份</th><th style="width:22%">口径说明</th>
              <th style="width:8%">状态</th><th>来源</th></tr>
          ${A.map(a=>`<tr><td class="num">${a.id}</td><td>${esc(a.name)}</td>
            <td style="color:#e9eefb"><b>${esc(a.val)}</b> <span style="color:#6d86ab;font-size:11.5px">${esc(a.unit)}</span></td>
            <td style="font-size:12px">${esc(a.year)}</td>
            <td style="font-size:11.5px;color:#8ba0c2">${esc(a.scope)}</td>
            <td style="font-size:11.5px;color:${a.status==='已核实'?'#34d399':a.status==='部分核实'?'#fbbf24':'#a78bfa'}">${a.status}</td>
            <td style="font-size:11.5px;color:#6d86ab">${esc(a.src)}
              ${a.url?`<div><a href="${a.url}" target="_blank" rel="noopener" style="color:#7dd3fc">原文</a></div>`:''}</td></tr>`).join('')}
        </table>
      </div>
      <div class="card">
        <h2>五个必须先说清的口径陷阱</h2>
        <ul style="list-style:none;display:grid;gap:10px">
          ${T.anchorTraps.map(t=>`<li style="font-size:13px;color:#c8d7ee;line-height:1.8">
            <b style="color:#fbbf24">${esc(t.t)}</b><br><span style="color:#a9bfdc">${esc(t.d)}</span></li>`).join('')}
        </ul>
      </div>`;
  }
}
document.getElementById('refTabs').addEventListener('click', e=>{
  const b = e.target.closest('.stab'); if(!b) return;
  document.querySelectorAll('.stab').forEach(x=>x.classList.toggle('on', x===b));
  refView = b.dataset.r; drawRef();
});

/* ================= Tab ================= */
const VIEWS = {know:'view-know', carbon:'view-carbon', ref:'view-ref', proj:'view-proj'};
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  const v = b.dataset.v;
  Object.keys(VIEWS).forEach(k=>{
    const el = document.getElementById(VIEWS[k]);
    if(el) el.hidden = (k!==v);
  });
  document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('on', x.dataset.v===v));
  try{ history.replaceState(null,'','#'+v); }catch(err){}
  window.scrollTo({top:0});
});

document.getElementById('s-parts').textContent = K.totals.parts;
document.getElementById('s-mods').textContent = K.totals.modules;
document.getElementById('s-secs').textContent = K.totals.sectionCount;
document.getElementById('s-q').textContent = K.totals.questions;
document.getElementById('s-a').textContent = K.totals.anchors;
document.getElementById('s-ds').textContent = K.totals.datasets;
document.getElementById('s-md').textContent = K.totals.models;
document.getElementById('s-ver').textContent = K.version;
document.getElementById('s-built').textContent = ' · ' + K.built;

drawTOC(); drawIntro(); drawCarbon(); drawRef(); drawProj();

document.addEventListener('click', e=>{
  const a = e.target.closest('.guide a');
  if(a){ document.querySelector('.tab[data-v="ref"]').click(); }
});

(function deepLink(){
  const h = (location.hash||'').replace('#','');
  // 模块深链接：#K01 ~ #K16
  if(/^K\d\d$/.test(h) && MODS[h]){
    renderModule(h);
    return;
  }
  if(h && VIEWS[h] && h!=='know'){
    const b = document.querySelector(`#tabs .tab[data-v="${h}"]`);
    if(b) b.click();
  }
})();
</script>
